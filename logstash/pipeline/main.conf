input {
  beats {
    port => 5044
  }
}

filter {
  grok {
    match => { "message" => "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:host_name} %{PROG:program}: %{GREEDYDATA:log_message}" }
    tag_on_failure => []
  }

  grok {
    match => { "message" => "%{IP:src_ip}" }
    tag_on_failure => []
  }

  if [src_ip] and [src_ip] !~ /^(10\.|172\.(1[6-9]|2[0-9]|3[0-1])\.|192\.168\.|127\.)/ {
    http {
      url => "https://www.virustotal.com/api/v3/ip_addresses/%{[src_ip]}"
      verb => "GET"
      headers => {
        "x-apikey" => "${VT_API_KEY}"
      }
      target_body => "vt_response"
      connect_timeout => 5
      socket_timeout => 10
    }

    ruby {
      code => '
        vt = event.get("vt_response")
        if vt && vt["data"] && vt["data"]["attributes"]
          attrs = vt["data"]["attributes"]
          stats = attrs["last_analysis_stats"] || {}
          event.set("vt_malicious",   stats["malicious"]  || 0)
          event.set("vt_suspicious",  stats["suspicious"] || 0)
          event.set("vt_country",     attrs["country"]    || "unknown")
          event.set("vt_reputation",  attrs["reputation"] || 0)
          total = (stats["malicious"] || 0) + (stats["suspicious"] || 0)
          event.set("vt_threat_score", total)
          if total >= 5
            event.set("threat_level", "critical")
          elsif total >= 2
            event.set("threat_level", "high")
          elsif total >= 1
            event.set("threat_level", "medium")
          else
            event.set("threat_level", "low")
          end
        end
        event.remove("vt_response")
      '
    }
  }

  if [src_ip] {
    geoip {
      source => "src_ip"
      target => "geoip"
    }
  }

  if [vt_threat_score] and [vt_threat_score] >= 3 {
    mutate { add_tag => ["malicious_ip", "alert"] }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "security-logs-%{+YYYY.MM.dd}"
  }
  if "alert" in [tags] {
    stdout {
      codec => rubydebug
    }
  }
}